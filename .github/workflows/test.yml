name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Run tests
      run: dotnet test CurrencyConverterExtension.sln -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false -p:EnableMsixTooling=false --verbosity normal